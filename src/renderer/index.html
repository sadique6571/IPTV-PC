<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV Desktop</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><img class="brand-icon" src="../../assets/icon.png" alt="IPTV"> IPTV <span id="version" class="version"></span></div>
    <nav id="tabs" role="tablist">
      <button class="tab active" data-tab="tv" role="tab">Live TV</button>
      <button class="tab" data-tab="movies" role="tab">Movies &amp; Series</button>
    </nav>
    <div class="top-right">
      <button id="toggleList" class="pill" title="List chhupao / dikhao (L)">☰ List chhupao</button>
      <button id="openM3U" class="pill" title="Load a playlist file (.m3u)">Open M3U</button>
      <button id="checkUpdate" class="pill" title="Check for updates">⬆ Check for updates</button>
      <span id="clock" class="clock"></span>
      <div class="win-controls" role="group" aria-label="Window controls">
        <button id="winMin" class="win-btn" title="Minimise">—</button>
        <button id="winMax" class="win-btn" title="Maximise">▢</button>
        <button id="winClose" class="win-btn close" title="Close">✕</button>
      </div>
    </div>
  </header>

  <main id="split">
    <!-- LEFT: lists -->
    <section id="leftPane">
      <!-- Live TV view -->
      <div id="tvView" class="view">
        <div class="search-row">
          <input id="tvSearch" type="text" placeholder="Search channels…" autocomplete="off">
          <button id="arrangeBtn" class="pill" title="Channel order badlein — drag, Shift+↑/↓, ya sort">⇅ Arrange</button>
        </div>
        <div id="arrangeMenu" class="popup arrange hidden"></div>
        <div id="catChips" class="chips"></div>
        <div id="catalogTitle" class="catalog-title"></div>
        <div id="channelList" class="list" tabindex="0"></div>
      </div>

      <!-- Movies view -->
      <div id="moviesView" class="view hidden">
        <div class="search-row">
          <input id="movieSearch" type="text" placeholder="Search movies &amp; series…" autocomplete="off">
        </div>
        <div id="moviesHome">
          <div id="continueRow" class="rail hidden">
            <div class="rail-title">Continue Watching</div>
            <div id="continueList" class="rail-items"></div>
          </div>
          <div id="movieRails"></div>
        </div>
        <div id="movieResults" class="list hidden"></div>
        <div id="detailsView" class="details hidden"></div>
      </div>

      <div id="statusBar" class="status">Loading channels…</div>
    </section>

    <!-- Draggable divider: list vs player (v1.0.1) -->
    <div id="splitter" role="separator" aria-orientation="vertical" aria-label="List aur player ka size badlein" tabindex="0" title="Drag karein — list / player size"><div class="split-grip"></div></div>

    <!-- RIGHT: player -->
    <section id="rightPane">
      <div id="playerWrap">
        <video id="video" playsinline></video>
        <iframe id="ytFrame" class="yt-frame hidden" title="YouTube player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        <button id="ytOpenBrowser" class="yt-browser-btn hidden" title="Agar YouTube embed na chale to browser mein kholein">↗ Browser mein kholein</button>
        <div id="nowPlaying" class="now-playing hidden"></div>
        <div id="bigPlay" class="big-play hidden">▶</div>
        <button id="showListBtn" class="show-list hidden" title="List dikhao (L)">☰ List dikhao</button>
        <div id="codecMsg" class="codec-msg hidden">
          <div class="codec-title" id="codecTitle">Ye channel MPEG-2 video hai</div>
          <div class="codec-text" id="codecText">Browser player mein iski picture nahi chal sakti — isko external player (jaise VLC) mein kholein.</div>
          <button id="btnOpenExternal" class="btn primary">VLC mein kholo</button>
        </div>
        <div id="playerBar">
          <button id="btnPlay" class="disc" title="Play / Pause (Space)">▶</button>
          <button id="btnBack10" class="chip-btn" title="Back 10s (←)">−10</button>
          <button id="btnFwd10" class="chip-btn" title="Forward 10s (→)">+10</button>
          <input id="seek" type="range" min="0" max="1000" value="0" step="1">
          <span id="timeRead" class="time">0:00 / 0:00</span>
          <button id="btnPrev" class="chip-btn" title="Previous episode">Prev</button>
          <button id="btnNext" class="chip-btn" title="Next episode">Next</button>
          <button id="btnCC" class="chip-btn" title="English subtitles">CC</button>
          <button id="btnQuality" class="chip-btn" title="Quality">Quality</button>
          <button id="btnFull" class="chip-btn" title="Fullscreen (F)">⛶</button>
        </div>
        <div id="popupMenu" class="popup hidden"></div>
        <div id="toast" class="toast hidden"></div>
      </div>
      <div id="upNext" class="up-next hidden"></div>
    </section>
  </main>

  <!-- Update dialog -->
  <div id="updateDialog" class="overlay hidden">
    <div class="dialog">
      <div class="dlg-title">⬆ App Update</div>
      <div id="updText" class="dlg-text"></div>
      <div id="updNotes" class="dlg-notes hidden"></div>
      <div id="updProgress" class="hidden">
        <progress id="updBar" max="100" value="0"></progress>
        <div id="updPct" class="dlg-text">Download ho raha hai… 0%</div>
      </div>
      <div id="updDone" class="dlg-text hidden"></div>
      <div class="dlg-actions">
        <button id="updLater" class="btn">Baad mein</button>
        <button id="updDownload" class="btn primary">Download</button>
        <button id="updInstall" class="btn primary hidden">Install &amp; Restart</button>
        <button id="updClose" class="btn hidden">Close</button>
      </div>
    </div>
  </div>
</div>
<script src="vendor/hls.min.js"></script>
<script src="vendor/mpegts.js"></script>
<script src="channels.js"></script>
<script src="app.js"></script>
</body>
</html>
