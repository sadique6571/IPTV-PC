name: IPTV Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Desktop-portable
          path: dist/IPTV-Desktop-portable.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IPTV-Desktop-portable
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2.3
          name: IPTV Desktop 1.0.2 (build 3)
          body: |
            v1.0.2 — Android icon, draggable divider, HLS recovery, list hide, glass player bar, Geo Super MPEG-2 notice. Portable exe, no install needed.
            Live TV (109 channels) + Movies/Series, same TV style as the Android app.
          files: dist/IPTV-Desktop-portable.exe
